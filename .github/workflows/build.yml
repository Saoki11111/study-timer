name: Build StudyTimer

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Build app
        run: bash build_app.sh

      - name: Package (zip and dmg)
        run: |
          ditto -c -k --sequesterRsrc --keepParent StudyTimer.app StudyTimer.zip
          mkdir -p dmg-root
          cp -R StudyTimer.app dmg-root/
          ln -s /Applications dmg-root/Applications
          hdiutil create -volname StudyTimer -srcfolder dmg-root -ov -format UDZO StudyTimer.dmg

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: StudyTimer
          path: |
            StudyTimer.zip
            StudyTimer.dmg

      - name: Publish to "latest" release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: StudyTimer (latest build)
          files: |
            StudyTimer.zip
            StudyTimer.dmg
          make_latest: true
